# xemu keymap for sevenships, passed by `make run` (-keymap). Only the lines
# here change; everything else keeps xemu's default.
#
# The MEGA65 has no keypad, so xemu normally gives keypad 2 4 6 8 to its fake
# joystick and 7 9 1 3 to nothing. Here keypad 7 9 4 6 1 3 become F5-F10,
# which the game reads in xemu as the six moves NW NE W E SW SE (KEY_PAD_FIRST
# in src/input.h). F5-F10 because nothing in the game wants them: F1-F4 are
# the advisors. The PC keys F9-F11 are still xemu's hot keys; these are the
# MEGA65's F keys, reached from the keypad. HELP is PageUp, as xemu has it. Keypad 5 and 0 stay the fake
# joystick's fire.
F5 Keypad 7
F6* Keypad 9
F7 Keypad 4
F8* Keypad 6
F9 Keypad 1
F10* Keypad 3
XEMU-JOY-UP Unknown
XEMU-JOY-DOWN Unknown
XEMU-JOY-LEFT Unknown
XEMU-JOY-RIGHT Unknown
